# Novaroma prompt for Starship (https://starship.rs) — zsh, bash, fish, PowerShell, cmd.
# Uses only the 16 ANSI colours, so it follows the active Novaroma theme in VS Code:
#   yellow = Sommer gold, green = sv-forest, red = Frühling pink, blue = Winter blue,
#   purple = main burgundy (light) / Frühling rose (dark), bright-black = muted.
# Needs no Nerd Font. Plain-text glyphs only.

"$schema" = "https://starship.rs/config-schema.json"
add_newline = true

format = """
[╭─](bright-black)$os$username$hostname$directory$git_branch$git_state$git_status\
$python$dotnet$nodejs$c$rust$golang$docker_context$cmd_duration
[╰─](bright-black)$character"""

right_format = "$time"

[character]
success_symbol = "[❯](bold purple)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold purple)"

[os]
disabled = true

[username]
show_always = false
format = "[$user]($style)[@](bright-black)"
style_user = "purple"
style_root = "bold red"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "purple"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold purple"
read_only = " ro"
read_only_style = "red"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[on](bright-black) [⑂ $branch]($style) "
style = "yellow"

[git_state]
format = "[\\($state( $progress_current/$progress_total)\\)]($style) "
style = "bold red"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "red"
modified = "*"
staged = "+"
untracked = "?"
deleted = "-"
renamed = "»"
stashed = "≡"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕"
conflicted = "!"

[python]
format = "[via](bright-black) [py ${version}( \\($virtualenv\\))]($style) "
style = "blue"

[dotnet]
format = "[via](bright-black) [.NET $version]($style) "
style = "red"

[nodejs]
format = "[via](bright-black) [node $version]($style) "
style = "yellow"

[c]
format = "[via](bright-black) [c $version]($style) "
style = "yellow"

[rust]
format = "[via](bright-black) [rs $version]($style) "
style = "red"

[golang]
format = "[via](bright-black) [go $version]($style) "
style = "cyan"

[docker_context]
format = "[via](bright-black) [docker $context]($style) "
style = "blue"

[cmd_duration]
min_time = 2000
format = "[took](bright-black) [$duration]($style) "
style = "yellow"

[time]
disabled = false
format = "[$time]($style)"
style = "bright-black"
time_format = "%H:%M"
